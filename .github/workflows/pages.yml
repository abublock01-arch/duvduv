name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create config.js from secret
        run: |
          if [ -z "${{ secrets.MAPBOX_TOKEN }}" ]; then
            echo "window.DUVDUV_CONFIG={mapboxToken:''};" > config.js
            echo "::warning::MAPBOX_TOKEN secret yo'q — xarita ishlamaydi"
          else
            echo "window.DUVDUV_CONFIG={mapboxToken:'${{ secrets.MAPBOX_TOKEN }}'};" > config.js
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
