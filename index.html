<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>duv•duv</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#fff;font-family:-apple-system,'SF Pro Display','Segoe UI',sans-serif;overflow:hidden}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.header{padding:max(12px,env(safe-area-inset-top)) 24px 16px;background:#fff;z-index:20;position:relative;flex-shrink:0}
.logo{display:flex;justify-content:center;align-items:center;font-size:28px;font-weight:900;letter-spacing:-.03em;margin-bottom:20px;height:32px}
.logo span{color:#111;line-height:1;transform:translateY(2px)}
.logo-dot{width:10px;height:10px;background:#D35400;border-radius:50%;margin:0 6px;flex-shrink:0;transform:translateY(3px)}
.toggle{background:#F4F4F5;border-radius:100px;padding:4px;display:flex;gap:4px}
.toggle-btn{flex:1;padding:10px;border-radius:100px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .25s;font-family:inherit;background:transparent;color:#888}
.toggle-btn.active{background:#D35400;color:#fff;box-shadow:0 8px 16px rgba(211,84,0,.25),inset 0 2px 4px rgba(255,255,255,.3)}
.content{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
#senderView{display:flex;flex-direction:column;align-items:center;padding:0 24px;height:100%;overflow:hidden}
.scene{width:100%;height:320px;position:relative;display:flex;align-items:center;justify-content:center;margin-top:8px;flex-shrink:0;pointer-events:none}
@keyframes floatSlow{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(-4deg)}}
@keyframes floatFast{0%,100%{transform:translateY(0) rotate(8deg)}50%{transform:translateY(-12px) rotate(12deg)}}
@keyframes floatOpp{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(8px) scale(.95)}}
@keyframes floatEnv{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(-12deg)}}
.road{position:absolute;top:195px;width:240px;height:65px;background:#F8F8F9;border-radius:2rem;border:1px solid #eeeef0;transform:rotate(-12deg);animation:floatOpp 6s ease-in-out infinite;display:flex;align-items:center;justify-content:center}
.road-line{width:80%;height:3px;border-top:3px dashed #111;opacity:.15}
.camera{position:absolute;z-index:30;width:110px;height:75px;background:#EBEBEC;border-radius:24px;border:1px solid #fff;animation:floatSlow 5s ease-in-out infinite;transform:translateY(-32px);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(0,0,0,.12)}
.cam-shutter{position:absolute;top:-8px;right:16px;width:18px;height:8px;background:#D35400;border-radius:4px 4px 0 0}
.cam-flash{position:absolute;top:10px;right:12px;width:12px;height:10px;background:#fff;border-radius:50%}
.cam-lens{width:50px;height:50px;background:#111;border-radius:50%;border:4px solid #D35400;box-shadow:0 6px 12px rgba(0,0,0,.2),inset 0 3px 8px rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.cam-lens::before{content:'';position:absolute;top:4px;left:6px;width:16px;height:16px;background:#fff;border-radius:50%;opacity:.2;filter:blur(1px)}
.cam-inner{width:22px;height:22px;background:#222;border-radius:50%;border:1px solid #333;display:flex;align-items:center;justify-content:center}
.cam-dot{width:6px;height:6px;background:rgba(255,255,255,.3);border-radius:50%;filter:blur(1px)}
.box{position:absolute;z-index:20;width:70px;height:70px;background:#fff;border-radius:16px;border:1px solid #f4f4f5;animation:floatFast 4.5s ease-in-out infinite;transform:translateY(64px) translateX(-64px);box-shadow:0 20px 40px rgba(0,0,0,.08);overflow:hidden}
.box-tape{position:absolute;top:0;bottom:0;left:20px;width:14px;background:#D35400;opacity:.95}
.env{position:absolute;z-index:10;width:75px;height:55px;background:#fff;border-radius:12px;border:1px solid #f4f4f5;animation:floatEnv 5.5s ease-in-out infinite;transform:translateY(40px) translateX(64px) rotate(12deg);box-shadow:0 20px 40px rgba(0,0,0,.08);overflow:hidden}
.env-top{position:absolute;top:0;left:0;width:100%;height:28px;background:#fafafa;border-bottom:1px solid #eee;clip-path:polygon(0 0,100% 0,50% 100%)}
.env-seal{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:14px;height:14px;background:#D35400;border-radius:50%}
.cloud{position:absolute;z-index:0;top:55px;right:20px;animation:floatSlow 6s ease-in-out infinite reverse}
.cloud-body{width:60px;height:28px;background:#fff;border-radius:100px;border:1px solid #f9f9f9;box-shadow:0 20px 40px rgba(0,0,0,.08)}
.cloud-puff{position:absolute;top:-12px;left:10px;width:30px;height:30px;background:#fff;border-radius:50%}
.cube{position:absolute;z-index:0;bottom:100px;left:40px;width:24px;height:24px;background:#D35400;border-radius:8px;animation:floatFast 4s ease-in-out infinite reverse;transform:rotate(24deg)}
.sender-title{text-align:center;font-size:34px;font-weight:900;color:#111;line-height:1.05;letter-spacing:-.03em;margin-top:8px;z-index:10;flex-shrink:0}
.cta-wrap{flex:1;display:flex;align-items:flex-end;padding-bottom:max(32px,env(safe-area-inset-bottom));width:100%}
.cta-btn{width:100%;height:64px;background:linear-gradient(to bottom,#2A2A2A,#111);border:1px solid #333;border-radius:100px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 24px;box-shadow:0 20px 40px rgba(0,0,0,.2),inset 0 2px 4px rgba(255,255,255,.15);cursor:pointer;transition:all .3s;position:relative;overflow:hidden;outline:none}
.cta-btn:active{transform:scale(.98)}
.cta-shine{position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(to bottom,rgba(255,255,255,.1),transparent);pointer-events:none}
.cta-icon{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.cta-icon svg{width:20px;height:20px;stroke:#fff;stroke-width:3;fill:none}
.cta-text{color:#fff;font-size:17px;font-weight:700;position:relative;z-index:1}
#driverView{display:none;flex-direction:column;align-items:center;padding:0 24px;height:100%}
.driver-title{text-align:center;font-size:34px;font-weight:900;color:#111;line-height:1.05;letter-spacing:-.03em;margin-top:40px;margin-bottom:28px}
.map-wrap{width:100%;flex:1;margin-bottom:36px;background:#F9F9FA;border-radius:40px;border:1px solid #eeeef0;overflow:hidden;position:relative}
.map-grid{position:absolute;inset:0;opacity:.5;background-image:linear-gradient(#E8E8EB 2px,transparent 2px),linear-gradient(90deg,#E8E8EB 2px,transparent 2px);background-size:40px 40px;pointer-events:none}
.marker{position:absolute;display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:10}
.marker-price{position:absolute;bottom:68px;background:#fff;color:#111;padding:8px 18px;border-radius:16px;font-weight:700;font-size:15px;box-shadow:0 12px 24px rgba(0,0,0,.08);white-space:nowrap;border:1px solid #f5f5f5}
.marker-pin{width:56px;height:56px;background:#D35400;border-radius:16px;display:flex;align-items:center;justify-content:center;border:1px solid #e66210;box-shadow:0 12px 24px rgba(211,84,0,.3),inset 0 4px 8px rgba(255,255,255,.4)}
.marker-pin svg{width:24px;height:24px;stroke:#fff;stroke-width:2.5;fill:none}
.sheet-overlay{position:fixed;inset:0;background:rgba(17,17,17,.3);backdrop-filter:blur(6px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.sheet-overlay.open{display:flex}
.sheet{background:#fff;border-radius:40px 40px 0 0;width:100%;padding:32px;padding-bottom:max(40px,env(safe-area-inset-bottom));box-shadow:0 -20px 40px rgba(0,0,0,.1);animation:sheetUp .3s cubic-bezier(.4,0,.2,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-drag{width:48px;height:6px;background:#E5E5E5;border-radius:100px;margin:0 auto 32px}
.sheet-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}
.sheet-amount-lbl{font-size:12px;font-weight:700;color:#A1A1AA;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.sheet-amount{font-size:42px;font-weight:900;color:#111;letter-spacing:-.03em;line-height:1}
.sheet-icon-wrap{width:56px;height:56px;border-radius:16px;background:#F4F4F5;display:flex;align-items:center;justify-content:center}
.sheet-icon-wrap svg{width:24px;height:24px;stroke:#D35400;stroke-width:2.5;fill:none}
.sheet-fields{display:flex;flex-direction:column;gap:12px;margin-bottom:36px}
.sheet-field{background:#F9F9FA;padding:20px 24px;border-radius:20px;border:1px solid #eeeef0}
.sheet-field-lbl{font-size:11px;font-weight:700;color:#A1A1AA;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.sheet-field-val{font-size:18px;font-weight:700;color:#111}
.sheet-accept{width:100%;background:#D35400;color:#fff;padding:20px;border-radius:100px;font-size:16px;font-weight:700;border:none;cursor:pointer;font-family:inherit;box-shadow:0 12px 24px rgba(211,84,0,.3)}
.sheet--send{padding-top:12px;padding-bottom:max(28px,env(safe-area-inset-bottom))}
.send-thumb-wrap{display:flex;justify-content:center;margin-bottom:24px}
.send-thumb{width:80px;height:80px;border-radius:14px;object-fit:cover;border:1px solid #EEE}
.send-form{display:flex;flex-direction:column;gap:16px}
.send-field{display:flex;flex-direction:column;gap:6px}
.send-label{font-size:12px;font-weight:600;color:#888}
.send-input,.send-textarea{
  width:100%;padding:14px 0;border:none;border-bottom:1px solid #E8E8E8;
  background:transparent;font-size:17px;font-weight:500;color:#111;
  font-family:inherit;outline:none;border-radius:0;
  transition:border-color .2s;
}
.send-input::placeholder,.send-textarea::placeholder{color:#C4C4C4}
.send-input:focus,.send-textarea:focus{border-bottom-color:#D35400}
.send-textarea{min-height:64px;resize:none;line-height:1.45;padding-top:4px}
.send-submit{
  width:100%;margin-top:8px;padding:18px;border:none;border-radius:100px;
  background:#D35400;color:#fff;font-size:16px;font-weight:700;
  font-family:inherit;cursor:pointer;box-shadow:0 10px 24px rgba(211,84,0,.28);
}
.send-submit:active{transform:scale(.98)}
.send-submit:disabled{opacity:.45;cursor:not-allowed;transform:none}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo"><span>duv</span><div class="logo-dot"></div><span>duv</span></div>
    <div class="toggle">
      <button class="toggle-btn active" id="btnSender" onclick="switchView('sender')">Jo'natuvchi</button>
      <button class="toggle-btn" id="btnDriver" onclick="switchView('driver')">Haydovchi</button>
    </div>
  </div>
  <div class="content">
    <div id="senderView">
      <div class="scene">
        <div class="road"><div class="road-line"></div></div>
        <div class="camera"><div class="cam-shutter"></div><div class="cam-flash"></div><div class="cam-lens"><div class="cam-inner"><div class="cam-dot"></div></div></div></div>
        <div class="box"><div class="box-tape"></div></div>
        <div class="env"><div class="env-top"></div><div class="env-seal"></div></div>
        <div class="cloud"><div class="cloud-body"></div><div class="cloud-puff"></div></div>
        <div class="cube"></div>
      </div>
      <h2 class="sender-title">RASMGA OLING<br>VA JO'NATING</h2>
      <div class="cta-wrap">
        <button type="button" class="cta-btn" onclick="document.getElementById('photoInput').click()">
          <div class="cta-shine"></div>
          <div class="cta-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
          <span class="cta-text">Jo'natma yuborish</span>
        </button>
      </div>
    </div>
    <div id="driverView">
      <h2 class="driver-title">YUKLAR XARITASI</h2>
      <div class="map-wrap">
        <div class="map-grid"></div>
        <div class="marker" style="top:28%;left:22%" onclick="openSheet('Toshkent','Samarqand','150 000')"><div class="marker-price">150 000 so'm</div><div class="marker-pin"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div></div>
        <div class="marker" style="top:55%;left:58%" onclick="openSheet('Buxoro','Xiva','85 000')"><div class="marker-price">85 000 so'm</div><div class="marker-pin"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div></div>
        <div class="marker" style="top:70%;left:30%" onclick="openSheet('Farg\'ona','Toshkent','120 000')"><div class="marker-price">120 000 so'm</div><div class="marker-pin"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div></div>
      </div>
    </div>
  </div>
</div>

<!-- TO'G'RIDAN KAMERA -->
<input type="file" accept="image/*" capture="environment" id="photoInput" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0" onchange="onPhotoSelected(event)">

<div class="sheet-overlay" id="sendSheetOverlay" onclick="if(event.target===this)closeSendSheet()">
  <div class="sheet sheet--send" onclick="event.stopPropagation()">
    <div class="sheet-drag"></div>
    <div class="send-thumb-wrap">
      <img class="send-thumb" id="sendThumb" alt="Jo'natma rasmi">
    </div>
    <form class="send-form" id="sendForm" onsubmit="submitOrder(event)">
      <div class="send-field">
        <label class="send-label" for="sendPhone">Telefon raqam</label>
        <input class="send-input" type="tel" id="sendPhone" inputmode="tel" autocomplete="tel" placeholder="+998 90 123 45 67" required>
      </div>
      <div class="send-field">
        <label class="send-label" for="sendDest">Qayerga</label>
        <input class="send-input" type="text" id="sendDest" placeholder="Shahar, manzil" required>
      </div>
      <div class="send-field">
        <label class="send-label" for="sendNote">Izoh</label>
        <textarea class="send-textarea" id="sendNote" placeholder="Qo'shimcha (ixtiyoriy)"></textarea>
      </div>
      <button type="submit" class="send-submit" id="sendSubmitBtn">Yuborish</button>
    </form>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <div class="sheet-drag"></div>
    <div class="sheet-row">
      <div><div class="sheet-amount-lbl">To'lov miqdori</div><div class="sheet-amount" id="sheetPrice">150 000</div></div>
      <div class="sheet-icon-wrap"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
    </div>
    <div class="sheet-fields">
      <div class="sheet-field"><div class="sheet-field-lbl">Olib ketish</div><div class="sheet-field-val" id="sheetFrom">Toshkent</div></div>
      <div class="sheet-field"><div class="sheet-field-lbl">Yetkazish</div><div class="sheet-field-val" id="sheetTo">Samarqand</div></div>
    </div>
    <button class="sheet-accept" onclick="acceptOrder()">Buyurtmani Qabul Qilish</button>
  </div>
</div>

<script>
let previewObjectUrl = null;
let selectedPhotoFile = null;

if(window.Telegram?.WebApp){try{const tg=Telegram.WebApp;tg.ready();tg.expand();tg.setHeaderColor('#ffffff');tg.setBackgroundColor('#ffffff')}catch(_){}}

function switchView(v){
  document.getElementById('senderView').style.display=v==='sender'?'flex':'none';
  document.getElementById('driverView').style.display=v==='driver'?'flex':'none';
  document.getElementById('btnSender').className='toggle-btn'+(v==='sender'?' active':'');
  document.getElementById('btnDriver').className='toggle-btn'+(v==='driver'?' active':'');
}
function openSheet(from,to,price){
  document.getElementById('sheetFrom').textContent=from;
  document.getElementById('sheetTo').textContent=to;
  document.getElementById('sheetPrice').textContent=price+" so'm";
  document.getElementById('sheetOverlay').classList.add('open');
}
function closeSheet(){document.getElementById('sheetOverlay').classList.remove('open')}
function acceptOrder(){closeSheet();showToast('✅ Buyurtma qabul qilindi!')}
function onPhotoSelected(e){
  const file=e.target.files?.[0];
  if(!file)return;
  e.target.value='';
  if(previewObjectUrl)URL.revokeObjectURL(previewObjectUrl);
  selectedPhotoFile=file;
  previewObjectUrl=URL.createObjectURL(file);
  document.getElementById('sendThumb').src=previewObjectUrl;
  document.getElementById('sendForm').reset();
  document.getElementById('sendSheetOverlay').classList.add('open');
  document.body.style.overflow='hidden';
  if(window.Telegram?.WebApp?.HapticFeedback)Telegram.WebApp.HapticFeedback.notificationOccurred('success');
  setTimeout(()=>document.getElementById('sendPhone').focus(),400);
}

function closeSendSheet(){
  document.getElementById('sendSheetOverlay').classList.remove('open');
  document.body.style.overflow='';
  document.getElementById('sendForm').reset();
  if(previewObjectUrl){URL.revokeObjectURL(previewObjectUrl);previewObjectUrl=null}
  selectedPhotoFile=null;
  document.getElementById('sendThumb').removeAttribute('src');
}

function submitOrder(e){
  e.preventDefault();
  if(!selectedPhotoFile){showToast('Avval rasm oling');return}
  const phone=document.getElementById('sendPhone').value.trim();
  const dest=document.getElementById('sendDest').value.trim();
  const note=document.getElementById('sendNote').value.trim();
  if(!phone||!dest){showToast('Telefon va manzilni to\'ldiring');return}
  const btn=document.getElementById('sendSubmitBtn');
  btn.disabled=true;
  // keyingi bosqich: serverga yuborish
  setTimeout(()=>{
    closeSendSheet();
    btn.disabled=false;
    showToast('✅ Jo\'natma yuborildi!');
    if(window.Telegram?.WebApp?.HapticFeedback)Telegram.WebApp.HapticFeedback.notificationOccurred('success');
  },400);
}
function showToast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#D35400;color:#fff;padding:12px 20px;border-radius:100px;font-size:14px;font-weight:700;z-index:999;box-shadow:0 8px 24px rgba(211,84,0,.4);white-space:nowrap;font-family:inherit';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);
}
</script>
</body>
</html>
