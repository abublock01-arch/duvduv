<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>duv•duv</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#fff;font-family:-apple-system,'SF Pro Display','Segoe UI',sans-serif;overflow:hidden}

/* ── FULL SCREEN APP ── */
.app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  background:#fff;overflow:hidden;
}

/* HEADER */
.header{
  padding:max(12px,env(safe-area-inset-top)) 24px 16px;
  background:#fff;z-index:20;position:relative;flex-shrink:0;
}
.logo{display:flex;justify-content:center;align-items:center;font-size:28px;font-weight:900;letter-spacing:-.03em;margin-bottom:20px;height:32px}
.logo span{color:#111;line-height:1;transform:translateY(2px)}
.logo-dot{width:10px;height:10px;background:#D35400;border-radius:50%;margin:0 6px;flex-shrink:0;transform:translateY(3px)}

/* TOGGLE */
.toggle{background:#F4F4F5;border-radius:100px;padding:4px;display:flex;gap:4px}
.toggle-btn{
  flex:1;padding:10px;border-radius:100px;border:none;font-size:14px;font-weight:700;
  cursor:pointer;transition:all .25s;font-family:inherit;letter-spacing:-.01em;
  background:transparent;color:#888;
}
.toggle-btn.active{
  background:#D35400;color:#fff;
  box-shadow:0 8px 16px rgba(211,84,0,.25),inset 0 2px 4px rgba(255,255,255,.3),inset 0 -2px 4px rgba(0,0,0,.1);
}

/* CONTENT */
.content{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}

/* ══ SENDER VIEW ══ */
#senderView{
  display:flex;flex-direction:column;align-items:center;
  padding:0 24px;height:100%;overflow:hidden;
}

/* 3D SCENE */
.scene{
  width:100%;height:320px;position:relative;display:flex;
  align-items:center;justify-content:center;margin-top:8px;
  perspective:1000px;flex-shrink:0;pointer-events:none;
}

@keyframes floatSlow{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(-4deg)}}
@keyframes floatFast{0%,100%{transform:translateY(0) rotate(8deg)}50%{transform:translateY(-12px) rotate(12deg)}}
@keyframes floatOpp{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(8px) scale(.95)}}
@keyframes floatEnv{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(-12deg)}}

.clay{box-shadow:0 20px 40px rgba(0,0,0,.08),inset 0 4px 8px rgba(255,255,255,.8),inset 0 -4px 8px rgba(0,0,0,.05)}

/* Road */
.road{
  position:absolute;top:195px;width:240px;height:65px;
  background:#F8F8F9;border-radius:2rem;border:1px solid #eeeef0;
  transform:rotate(-12deg);animation:floatOpp 6s ease-in-out infinite;
  display:flex;align-items:center;justify-content:center;
}
.road-line{width:80%;height:3px;border-top:3px dashed #111;opacity:.15}

/* Camera */
.camera{
  position:absolute;z-index:30;width:110px;height:75px;
  background:#EBEBEC;border-radius:24px;border:1px solid #fff;
  animation:floatSlow 5s ease-in-out infinite;
  transform:translateY(-32px);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 20px 40px rgba(0,0,0,.12);
}
.cam-shutter{position:absolute;top:-8px;right:16px;width:18px;height:8px;background:#D35400;border-radius:4px 4px 0 0;box-shadow:inset 0 2px 4px rgba(255,255,255,.4),0 4px 8px rgba(211,84,0,.4)}
.cam-flash{position:absolute;top:10px;right:12px;width:12px;height:10px;background:#fff;border-radius:50%;box-shadow:inset 0 1px 2px rgba(0,0,0,.1)}
.cam-lens{width:50px;height:50px;background:#111;border-radius:50%;border:4px solid #D35400;box-shadow:0 6px 12px rgba(0,0,0,.2),inset 0 3px 8px rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.cam-lens::before{content:'';position:absolute;top:4px;left:6px;width:16px;height:16px;background:#fff;border-radius:50%;opacity:.2;filter:blur(1px)}
.cam-inner{width:22px;height:22px;background:#222;border-radius:50%;border:1px solid #333;box-shadow:inset 0 2px 4px rgba(0,0,0,1);display:flex;align-items:center;justify-content:center}
.cam-dot{width:6px;height:6px;background:rgba(255,255,255,.3);border-radius:50%;filter:blur(1px)}

/* Box */
.box{
  position:absolute;z-index:20;width:70px;height:70px;
  background:#fff;border-radius:16px;border:1px solid #f4f4f5;
  animation:floatFast 4.5s ease-in-out infinite;
  transform:translateY(64px) translateX(-64px);
  box-shadow:0 20px 40px rgba(0,0,0,.08);overflow:hidden;
}
.box-tape{position:absolute;top:0;bottom:0;left:20px;width:14px;background:#D35400;box-shadow:0 2px 8px rgba(0,0,0,.1);opacity:.95}
.box-line1{position:absolute;top:25px;left:10px;width:8px;height:2px;background:#111;opacity:.2;border-radius:2px}
.box-line2{position:absolute;top:32px;left:10px;width:6px;height:2px;background:#111;opacity:.2;border-radius:2px}

/* Envelope */
.env{
  position:absolute;z-index:10;width:75px;height:55px;
  background:#fff;border-radius:12px;border:1px solid #f4f4f5;
  animation:floatEnv 5.5s ease-in-out infinite;
  transform:translateY(40px) translateX(64px) rotate(12deg);
  box-shadow:0 20px 40px rgba(0,0,0,.08);overflow:hidden;
}
.env-top{position:absolute;top:0;left:0;width:100%;height:28px;background:#fafafa;border-bottom:1px solid #eee;clip-path:polygon(0 0,100% 0,50% 100%)}
.env-seal{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:14px;height:14px;background:#D35400;border-radius:50%;box-shadow:inset 0 1px 2px rgba(255,255,255,.4),0 2px 4px rgba(211,84,0,.3)}

/* Cloud */
.cloud{position:absolute;z-index:0;top:55px;right:20px;animation:floatSlow 6s ease-in-out infinite reverse}
.cloud-body{width:60px;height:28px;background:#fff;border-radius:100px;border:1px solid #f9f9f9;box-shadow:0 20px 40px rgba(0,0,0,.08),inset 0 4px 8px rgba(255,255,255,.8)}
.cloud-puff{position:absolute;top:-12px;left:10px;width:30px;height:30px;background:#fff;border-radius:50%;border-top:1px solid #f9f9f9}

/* Cube */
.cube{position:absolute;z-index:0;bottom:100px;left:40px;width:24px;height:24px;background:#D35400;border-radius:8px;border:1px solid #e66210;animation:floatFast 4s ease-in-out infinite reverse;transform:rotate(24deg);box-shadow:0 20px 40px rgba(0,0,0,.08)}

/* TITLE */
.sender-title{
  text-align:center;font-size:34px;font-weight:900;color:#111;
  line-height:1.05;letter-spacing:-.03em;margin-top:8px;z-index:10;
  text-shadow:0 1px 2px rgba(0,0,0,.05);flex-shrink:0;
}

/* Jo'natmalar ro'yxati */
.sender-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;
  width:100%;min-height:0;overflow:hidden;
}
.sender-empty.hidden{display:none}
.shipments-wrap{
  flex:1;display:none;flex-direction:column;
  width:100%;min-height:0;overflow:hidden;padding-top:4px;
}
.shipments-wrap.visible{display:flex}
.shipments-head{
  font-size:13px;font-weight:700;color:#D35400;
  text-transform:uppercase;letter-spacing:.06em;
  margin-bottom:12px;flex-shrink:0;
}
.shipments-list{
  flex:1;overflow-y:auto;display:flex;flex-direction:column;
  gap:10px;padding-bottom:8px;-webkit-overflow-scrolling:touch;
}
.shipment-card{
  display:flex;align-items:center;gap:14px;padding:12px 14px;
  background:#fff;border:1px solid #F0F0F0;border-radius:16px;
  box-shadow:0 2px 12px rgba(0,0,0,.04);
}
.shipment-thumb{
  width:56px;height:56px;border-radius:12px;object-fit:cover;
  border:1px solid #EEE;flex-shrink:0;
}
.shipment-body{flex:1;min-width:0}
.shipment-dest{
  font-size:16px;font-weight:700;color:#111;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;
}
.shipment-status{
  display:inline-block;font-size:12px;font-weight:700;color:#16a34a;
  background:rgba(22,163,74,.12);padding:4px 10px;border-radius:100px;
}

/* CTA */
.cta-wrap{
  flex-shrink:0;width:100%;
  padding:12px 0 max(24px,env(safe-area-inset-bottom));
  background:#fff;
}
.cta-btn{
  width:100%;height:64px;
  background:linear-gradient(to bottom,#2A2A2A,#111);
  border:1px solid #333;border-radius:100px;
  display:flex;align-items:center;justify-content:center;gap:12px;padding:0 24px;
  box-shadow:0 20px 40px rgba(0,0,0,.2),inset 0 2px 4px rgba(255,255,255,.15),inset 0 -2px 4px rgba(0,0,0,.4);
  cursor:pointer;transition:all .3s;position:relative;overflow:hidden;outline:none;
}
.cta-btn:active{transform:scale(.98);box-shadow:0 10px 20px rgba(0,0,0,.2),inset 0 1px 2px rgba(255,255,255,.1),inset 0 -2px 4px rgba(0,0,0,.6)}
.cta-shine{position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(to bottom,rgba(255,255,255,.1),transparent);pointer-events:none}
.cta-icon{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 2px rgba(255,255,255,.2)}
.cta-icon svg{width:20px;height:20px;stroke:#fff;stroke-width:3;fill:none}
.cta-text{color:#fff;font-size:17px;font-weight:700;letter-spacing:.02em;position:relative;z-index:1;text-shadow:0 2px 4px rgba(0,0,0,.5)}

/* ══ DRIVER VIEW ══ */
#driverView{
  display:none;flex-direction:column;align-items:center;
  padding:0 24px;height:100%;min-height:0;flex:1;
}
.driver-title{
  text-align:center;font-size:34px;font-weight:900;color:#111;
  line-height:1.05;letter-spacing:-.03em;margin-top:24px;margin-bottom:16px;
  text-shadow:0 1px 2px rgba(0,0,0,.05);flex-shrink:0;
}

/* MAP */
.map-wrap{
  width:100%;height:100%;flex:1;min-height:0;
  background:#F9F9FA;border-radius:40px;
  box-shadow:inset 0 4px 16px rgba(0,0,0,.03),0 2px 0 #fff;
  border:1px solid #eeeef0;overflow:hidden;position:relative;
}
#map{width:100%;height:100%;z-index:1;border-radius:40px}
.mapboxgl-ctrl-bottom-right,.mapboxgl-ctrl-bottom-left{display:none}
.map-order-marker{
  width:40px;height:40px;background:#D35400;border-radius:50% 50% 50% 4px;
  transform:rotate(-45deg);border:3px solid #fff;cursor:pointer;
  box-shadow:0 6px 16px rgba(211,84,0,.45);
}
.map-driver-marker{
  width:18px;height:18px;background:#2563eb;border:3px solid #fff;
  border-radius:50%;box-shadow:0 2px 10px rgba(37,99,235,.5);
}
.sheet-order-thumb{
  width:88px;height:88px;border-radius:16px;object-fit:cover;
  border:1px solid #EEE;display:block;margin:0 auto 24px;
}
.sheet--order .sheet-fields{margin-bottom:28px}

/* BOTTOM SHEET */
.sheet-overlay{
  position:fixed;inset:0;background:rgba(17,17,17,.3);
  backdrop-filter:blur(6px);z-index:100;
  display:none;align-items:flex-end;justify-content:center;
}
.sheet-overlay.open{display:flex}
.sheet{
  background:#fff;border-radius:40px 40px 0 0;width:100%;
  padding:32px;padding-bottom:max(40px,env(safe-area-inset-bottom));
  box-shadow:0 -20px 40px rgba(0,0,0,.1);border-top:1px solid #f0f0f0;
  animation:sheetUp .3s cubic-bezier(.4,0,.2,1);
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-drag{width:48px;height:6px;background:#E5E5E5;border-radius:100px;margin:0 auto 32px}
.sheet-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}
.sheet-amount-lbl{font-size:12px;font-weight:700;color:#A1A1AA;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.sheet-amount{font-size:42px;font-weight:900;color:#111;letter-spacing:-.03em;line-height:1}
.sheet-icon-wrap{width:56px;height:56px;border-radius:16px;background:#F4F4F5;border:1px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px rgba(0,0,0,.05),inset 0 2px 4px #fff}
.sheet-icon-wrap svg{width:24px;height:24px;stroke:#D35400;stroke-width:2.5;fill:none}
.sheet-fields{display:flex;flex-direction:column;gap:12px;margin-bottom:36px}
.sheet-field{background:#F9F9FA;padding:20px 24px;border-radius:20px;border:1px solid #eeeef0;box-shadow:inset 0 2px 4px rgba(0,0,0,.02),0 2px 0 #fff}
.sheet-field-lbl{font-size:11px;font-weight:700;color:#A1A1AA;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.sheet-field-val{font-size:18px;font-weight:700;color:#111}
.sheet-accept{
  width:100%;background:#D35400;color:#fff;padding:20px;border-radius:100px;
  font-size:16px;font-weight:700;border:none;cursor:pointer;font-family:inherit;
  box-shadow:0 12px 24px rgba(211,84,0,.3),inset 0 4px 8px rgba(255,255,255,.3),inset 0 -4px 8px rgba(0,0,0,.15);
  transition:transform .15s,box-shadow .15s;
}
.sheet-accept:active{transform:scale(.97)}

/* Jo'natma formasi sheet */
.sheet-overlay--send{z-index:210}
.sheet--send{padding-top:12px;padding-bottom:max(28px,env(safe-area-inset-bottom))}
.send-thumb-wrap{display:flex;justify-content:center;margin-bottom:20px}
.send-thumb{width:80px;height:80px;border-radius:14px;object-fit:cover;border:1px solid #EEE}
.send-form{display:flex;flex-direction:column;gap:14px}
.send-field{display:flex;flex-direction:column;gap:6px}
.send-label{font-size:12px;font-weight:600;color:#888}
.send-input,.send-textarea{
  width:100%;padding:14px 0;border:none;border-bottom:1px solid #E8E8E8;
  background:transparent;font-size:17px;color:#111;font-family:inherit;outline:none;
}
.send-input:focus,.send-textarea:focus{border-bottom-color:#D35400}
.send-input::placeholder,.send-textarea::placeholder{color:#C4C4C4}
.send-textarea{min-height:60px;resize:none;line-height:1.4}
.send-submit{
  width:100%;margin-top:6px;padding:18px;border:none;border-radius:100px;
  background:#D35400;color:#fff;font-size:16px;font-weight:700;font-family:inherit;
  cursor:pointer;box-shadow:0 10px 24px rgba(211,84,0,.28);
}
.send-submit:active{transform:scale(.98)}
.send-submit:disabled{opacity:.45;cursor:not-allowed}

/* ══ RASM YUKLASH — KONTENT MAYDONI (qizil ramka o'lchami) ══ */
.upload-overlay{
  position:fixed;inset:0;z-index:200;
  pointer-events:none;
}
.upload-overlay.open,
.upload-overlay.closing{pointer-events:auto}
.upload-backdrop{
  position:absolute;inset:0;
  background:rgba(0,0,0,0);
  transition:background .4s cubic-bezier(.4,0,.2,1);
}
.upload-overlay.open .upload-backdrop{background:rgba(17,17,17,.35)}
.upload-overlay.closing .upload-backdrop{background:rgba(0,0,0,0)}
.upload-panel{
  position:fixed;
  left:16px;right:16px;
  top:max(112px,calc(env(safe-area-inset-top) + 96px));
  bottom:max(124px,calc(env(safe-area-inset-bottom) + 108px));
  border-radius:36px;
  background:#fff;
  box-shadow:0 24px 64px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06);
  transform:scale(.15);
  opacity:0;
  transform-origin:center center;
  transition:transform .5s cubic-bezier(.32,.72,0,1),opacity .35s ease;
  display:flex;flex-direction:column;
  overflow:hidden;
  will-change:transform,opacity;
  z-index:1;
}
.upload-overlay.open .upload-panel{
  transform:scale(1);
  opacity:1;
}
.upload-overlay.closing .upload-panel{
  transform:scale(.15);
  opacity:0;
  transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .25s ease;
}
.upload-inner{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:16px 16px 8px;
  min-height:0;
  overflow:hidden;
  opacity:0;
  transition:opacity .25s ease .15s;
}
.upload-overlay.open .upload-inner{opacity:1}
.upload-overlay.closing .upload-inner{opacity:0;transition-delay:0s}
.upload-close{
  position:absolute;top:14px;right:14px;
  width:40px;height:40px;border-radius:50%;
  background:#F4F4F5;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;
  transition:background .2s,transform .15s;
}
.upload-close:active{transform:scale(.92);background:#E8E8EB}
.upload-close svg{width:20px;height:20px;stroke:#666;stroke-width:2.5;fill:none}
.upload-title{
  color:#111;font-size:20px;font-weight:800;
  letter-spacing:-.03em;margin-bottom:6px;text-align:center;
  padding-right:36px;padding-left:36px;
}
.upload-sub{
  color:#888;font-size:13px;font-weight:600;
  margin-bottom:10px;text-align:center;
  flex-shrink:0;
}
.upload-zone{
  width:100%;flex:1;min-height:120px;
  border:2px dashed #D4D4D8;
  border-radius:28px;
  position:relative;
  overflow:hidden;
  background:#111;
}
.upload-zone video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:none;
}
.upload-zone video.active{display:block}
.upload-preview{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:none;
}
.upload-preview.visible{display:block}
.camera-fallback{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:20px;
  background:#FAFAFA;text-align:center;
}
.camera-fallback[hidden]{display:none}
.camera-fallback p{color:#666;font-size:13px;font-weight:600}
.camera-fallback button{
  padding:10px 18px;border-radius:100px;border:none;
  background:#D35400;color:#fff;font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;
}
.zone-placeholder{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
  background:#FAFAFA;
}
.zone-placeholder.hidden{display:none}
.zone-placeholder svg{width:28px;height:28px;stroke:#D35400;stroke-width:2;fill:none}
.zone-placeholder span{color:#A1A1AA;font-size:12px;font-weight:600}
.zone-placeholder-btn{
  margin-top:4px;padding:10px 18px;border-radius:100px;border:none;
  background:#D35400;color:#fff;font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;pointer-events:auto;
}
.upload-actions{
  width:100%;display:flex;align-items:center;justify-content:center;
  gap:28px;
  padding:12px 16px max(14px,env(safe-area-inset-bottom));
  flex-shrink:0;
  background:#fff;
  border-top:1px solid #F0F0F0;
  position:relative;
  z-index:5;
}
.gallery-btn{
  width:48px;height:48px;border-radius:50%;
  background:#F4F4F5;border:1px solid #E8E8EB;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none;
}
.gallery-btn svg{width:22px;height:22px;stroke:#666;stroke-width:2;fill:none}
.capture-btn{
  width:72px;height:72px;border-radius:50%;
  border:5px solid #E5E5E5;background:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;
  box-shadow:0 4px 16px rgba(0,0,0,.12);
  transition:transform .15s;
}
.capture-btn:active{transform:scale(.92)}
.capture-btn-inner{
  width:56px;height:56px;border-radius:50%;background:#D35400;
  transition:background .2s;
}
.capture-btn.captured .capture-btn-inner{background:#111}
.flip-btn{
  width:48px;height:48px;border-radius:50%;
  background:#F4F4F5;border:1px solid #E8E8EB;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none;
}
.flip-btn svg{width:22px;height:22px;stroke:#666;stroke-width:2;fill:none}
.upload-file-input{display:none}

@media (max-height:740px){
  .upload-panel{
    top:max(100px,calc(env(safe-area-inset-top) + 88px));
    bottom:max(118px,calc(env(safe-area-inset-bottom) + 102px));
  }
  .upload-title{font-size:18px;margin-bottom:4px}
  .upload-sub{font-size:12px;margin-bottom:8px}
  .capture-btn{width:64px;height:64px;border-width:4px}
  .capture-btn-inner{width:48px;height:48px}
  .gallery-btn,.flip-btn{width:44px;height:44px}
}

/* ── Telegram tema (faqat .theme-telegram yoqilganda) ── */
.theme-btn{
  position:absolute;top:max(12px,env(safe-area-inset-top));right:20px;
  width:40px;height:40px;border-radius:50%;border:none;
  background:#F4F4F5;color:#111;cursor:pointer;z-index:30;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,color .2s,transform .15s;
  font-family:inherit;
}
.theme-btn:active{transform:scale(.92)}

function getCurrentPosition(){
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('Geolocation unavailable'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => resolve(pos.coords),
      err => reject(err),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
    );
  });
}

function initDriverMap(){
  if (map) return;
  if (!window.mapboxgl) {

  map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/streets-v12',
    center: [69.2401, 41.2991],
    zoom: 12
  });

    refreshOrderMarkers();
    centerMapOnDriver();
  });
}

function centerMapOnDriver(){
  if (!map) return;
  getCurrentPosition()
    .then(coords => {
      const lng = coords.longitude;
      const lat = coords.latitude;
      map.flyTo({ center: [lng, lat], zoom: 13, essential: true });
      if (!driverLocationMarker) {
        const el = document.createElement('div');
        el.className = 'map-driver-marker';
        driverLocationMarker = new mapboxgl.Marker({ element: el })
          .setLngLat([lng, lat])
          .addTo(map);
      } else {
        driverLocationMarker.setLngLat([lng, lat]);
      }
    })
    .catch(() => {
      map.flyTo({ center: [69.2401, 41.2991], zoom: 13, essential: true });
    });
}

function refreshOrderMarkers(){
  if (!map) return;
  orderMapMarkers.forEach(m => m.remove());
  orderMapMarkers.length = 0;
  orders.forEach(order => {

    const el = document.createElement('div');
    el.className = 'map-order-marker';
    const marker = new mapboxgl.Marker({ element: el })
      .setLngLat([order.lng, order.lat])
      .addTo(map);
    el.addEventListener('click', e => {
      e.stopPropagation();
      openOrderSheet(order);

function getUserMediaWithTimeout(constraints, ms){
  return new Promise((resolve, reject) => {
    if (!navigator.mediaDevices?.getUserMedia) {
      reject(new Error('unsupported'));
      return;
    }
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      reject(new Error('timeout'));
    }, ms);
    navigator.mediaDevices.getUserMedia(constraints)
      .then(stream => {
        if (settled) {
          stream.getTracks().forEach(t => t.stop());
          return;
        }
        settled = true;
        clearTimeout(timer);
        resolve(stream);
      })
      .catch(err => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        reject(err);
      });
  });
}

}

async function thumbToStorable(url){
  if (!url || url.startsWith('data:')) return url;
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    return await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  } catch {
    return url;
  }
}

  if (!shipments.length) {
    empty.classList.remove('hidden');
    wrap.classList.remove('visible');
    list.innerHTML = '';
    return;
  }
  empty.classList.add('hidden');
  wrap.classList.add('visible');
  list.innerHTML = shipments.map(s => `
    <div class="shipment-card">
      <img class="shipment-thumb" src="${escapeHtml(s.thumbUrl)}" alt="">
      <div class="shipment-body">
        <div class="shipment-dest">${escapeHtml(s.dest)}</div>
        <span class="shipment-status">${escapeHtml(s.status)}</span>
      </div>
    </div>
  `).join('');
}

function openOrder(){
  const overlay = document.getElementById('uploadOverlay');
  overlay.classList.remove('closing');
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  startCamera();
}

function closeUpload(){
  const overlay = document.getElementById('uploadOverlay');
  if (!overlay.classList.contains('open')) return;
  cameraSession++;
  overlay.classList.remove('open');
  overlay.classList.add('closing');
  stopCamera();
  setTimeout(() => {
    overlay.classList.remove('closing');
    document.body.style.overflow = '';
    resetUpload();
  }, 550);
}

async function startCamera(){
  const video = document.getElementById('cameraVideo');
  const fallback = document.getElementById('cameraFallback');
  const placeholder = document.getElementById('zonePlaceholder');
  const placeholderText = document.getElementById('zonePlaceholderText');
  const preview = document.getElementById('photoPreview');
  if (preview.classList.contains('visible')) return;

  const session = ++cameraSession;
  stopCamera();
  fallback.hidden = true;
  placeholder.classList.remove('hidden');
  if (placeholderText) placeholderText.textContent = 'Kamera yuklanmoqda…';

  if (!navigator.mediaDevices?.getUserMedia) {
    showCameraFallback('Kamera qo\'llab-quvvatlanmaydi — galereyadan tanlang');
    return;
  }

  const constraintsList = [
    { video: { facingMode: { exact: facingMode } }, audio: false },
    { video: { facingMode: { ideal: facingMode } }, audio: false },
    { video: true, audio: false }
  ];

  try {
    let stream = null;
    for (const constraints of constraintsList) {
      if (session !== cameraSession) return;
      try {
        stream = await getUserMediaWithTimeout(constraints, 8000);
        break;
      } catch (_) {}
    }
    if (!stream) throw new Error('no stream');
    if (session !== cameraSession) {
      stream.getTracks().forEach(t => t.stop());
      return;
    }
    cameraStream = stream;
    video.srcObject = cameraStream;
    await Promise.race([
      video.play(),
      new Promise((_, reject) => setTimeout(() => reject(new Error('play timeout')), 5000))
    ]);
    if (session !== cameraSession) return;
    video.classList.add('active');
    placeholder.classList.add('hidden');
  } catch (err) {
    console.warn('Camera error:', err);
    if (session !== cameraSession) return;
    const msg = err && err.message === 'timeout'
      ? 'Kamera javob bermadi — galereyadan tanlang'
      : 'Kameraga ruxsat bering yoki galereyadan tanlang';
    showCameraFallback(msg);
  }
}

function stopCamera(){
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  const video = document.getElementById('cameraVideo');
  video.srcObject = null;
  video.classList.remove('active');
}

function flipCamera(){
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  if (document.getElementById('uploadOverlay').classList.contains('open')) {
    startCamera();
  }
}

function capturePhoto(){
  const video = document.getElementById('cameraVideo');
  const preview = document.getElementById('photoPreview');
  const captureBtn = document.getElementById('captureBtn');

  if (preview.classList.contains('visible')) {
    if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
    preview.src = '';
    preview.classList.remove('visible');
    captureBtn.classList.remove('captured');
    startCamera();
    return;
  }

  if (!cameraStream || !video.videoWidth) {
    showToast('Kamera tayyor emas');
    return;
  }

  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob(blob => {
    if (!blob) return;
    if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
    previewObjectUrl = URL.createObjectURL(blob);
    preview.src = previewObjectUrl;
    preview.classList.add('visible');
    captureBtn.classList.add('captured');
    stopCamera();
    document.getElementById('zonePlaceholder').classList.add('hidden');
    showToast('✅ Rasm olindi!');
    if (window.Telegram?.WebApp?.HapticFeedback) {
      Telegram.WebApp.HapticFeedback.notificationOccurred('success');
    }
    selectedPhotoFile = new File([blob], 'photo.jpg', { type: 'image/jpeg' });
    document.getElementById('sendThumb').src = previewObjectUrl;
    document.getElementById('sendForm').reset();
    document.getElementById('sendSheetOverlay').classList.add('open');
  }, 'image/jpeg', 0.9);
}

function openGallery(){
  document.getElementById('photoInput').click();
}

function resetUpload(){
  stopCamera();
  const input = document.getElementById('photoInput');
  const preview = document.getElementById('photoPreview');
  const captureBtn = document.getElementById('captureBtn');
  const fallback = document.getElementById('cameraFallback');
  const placeholder = document.getElementById('zonePlaceholder');
  input.value = '';
  if (previewObjectUrl && !shipments.some(s => s.thumbUrl === previewObjectUrl) && !orders.some(o => o.thumbUrl === previewObjectUrl)) {
    URL.revokeObjectURL(previewObjectUrl);
  }
  previewObjectUrl = null;
  preview.src = '';
  preview.classList.remove('visible');
  captureBtn.classList.remove('captured');
  fallback.hidden = true;
  placeholder.classList.remove('hidden');
}

function onPhotoSelected(e){
  const file = e.target.files?.[0];
  if (!file) return;
  stopCamera();
  const preview = document.getElementById('photoPreview');
  const captureBtn = document.getElementById('captureBtn');
  const placeholder = document.getElementById('zonePlaceholder');
  if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
  previewObjectUrl = URL.createObjectURL(file);
  preview.src = previewObjectUrl;
  preview.classList.add('visible');
  captureBtn.classList.add('captured');
  placeholder.classList.add('hidden');
  document.getElementById('cameraFallback').hidden = true;
  document.getElementById('cameraVideo').classList.remove('active');
  showToast('✅ Rasm yuklandi!');
  selectedPhotoFile = file;
  document.getElementById('sendThumb').src = previewObjectUrl;
  document.getElementById('sendForm').reset();
  document.getElementById('sendSheetOverlay').classList.add('open');
  if (window.Telegram?.WebApp?.HapticFeedback) {
    Telegram.WebApp.HapticFeedback.notificationOccurred('success');
  }
}

function closeSendSheet(){
  document.getElementById('sendSheetOverlay').classList.remove('open');
}

function submitOrder(e){
  e.preventDefault();
  if (!selectedPhotoFile && !previewObjectUrl) {
    showToast('Avval rasm oling');
    return;
  }
  const phone = document.getElementById('sendPhone').value.trim();
  const dest = document.getElementById('sendDest').value.trim();
  if (!phone || !dest) {
    showToast('Telefon va manzilni to\'ldiring');
    return;
  }
  const thumbUrl = previewObjectUrl;
  if (!thumbUrl) {
    showToast('Avval rasm oling');
    return;
  }
  const btn = document.getElementById('sendSubmitBtn');
  const note = document.getElementById('sendNote').value.trim();
  btn.disabled = true;

  async function saveOrder(coords){
    const storedThumb = await thumbToStorable(thumbUrl);
    const order = {
      id: Date.now(),
      thumbUrl: storedThumb,
      dest,
      phone,
      note,
      status: 'Aktiv',
      lat: coords ? coords.latitude : null,
      lng: coords ? coords.longitude : null,
      telegramId: telegramUser.id,
      telegramName: getTelegramName()
    };
    shipments.unshift(order);
    orders.unshift(order);
    persistData();
    saveOrderToFirestore(order);
    previewObjectUrl = null;
    selectedPhotoFile = null;
    renderShipments();
    if (map) refreshOrderMarkers();
    closeSendSheet();
    closeUpload();
    btn.disabled = false;
    showAlert('✅ Jo\'natma yuborildi!');
    if (window.Telegram?.WebApp?.HapticFeedback) {
      Telegram.WebApp.HapticFeedback.notificationOccurred('success');
    }
  }

  getCurrentPosition()
    .then(coords => saveOrder(coords))
    .catch(() => saveOrder(null));
}

function showAlert(msg){
  const tg = window.Telegram?.WebApp;
  if (tg?.showAlert) {
    tg.showAlert(msg);
    return;
  }
  showToast(msg);
}

function showToast(msg){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#D35400;color:#fff;padding:12px 20px;border-radius:100px;font-size:14px;font-weight:700;z-index:999;box-shadow:0 8px 24px rgba(211,84,0,.4);white-space:nowrap;font-family:inherit';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

initFirebase();
loadPersistedData();
</script>
